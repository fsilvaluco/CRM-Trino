name: Backup semanal de la base de datos

# Corre todos los domingos a las 09:00 UTC (06:00 hora Chile continental en
# horario de verano, 05:00 en horario de invierno) -- no depende de que
# ninguna maquina local este encendida, corre en la infraestructura de
# GitHub. "workflow_dispatch" permite dispararlo a mano desde la pestaña
# Actions del repo cuando se quiera un backup extra (ej. antes de un cambio
# riesgoso).
on:
  schedule:
    - cron: "0 9 * * 0"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencia de subida (googleapis)
        run: npm install googleapis@176.0.0 --no-save --no-audit --no-fund

      - name: Dump de la base (via imagen oficial postgres:17, misma version que Supabase)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_DB_URL:-}" ]; then
            echo "Falta el secret SUPABASE_DB_URL en el repo (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          mkdir -p backup-tmp
          FILENAME="artist-pro-db-$(date -u +%Y-%m-%d).sql.gz"
          docker run --rm -e PGURL="$SUPABASE_DB_URL" postgres:17 sh -c 'pg_dump "$PGURL" --no-owner --no-privileges' \
            | gzip > "backup-tmp/$FILENAME"
          echo "BACKUP_FILE=backup-tmp/$FILENAME" >> "$GITHUB_ENV"
          echo "BACKUP_NAME=$FILENAME" >> "$GITHUB_ENV"

      - name: Subir a Google Drive + rotar backups antiguos
        env:
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: node scripts/backup/upload-to-drive.mjs "$BACKUP_FILE" "$BACKUP_NAME"
